<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login | MedSync</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f7ff;
            color: #17243a;
        }

        header {
            min-height: 72px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid #e3eaf4;
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #1769e0;
            text-decoration: none;
        }

        .home-link {
            color: #34445a;
            text-decoration: none;
            font-size: 15px;
        }

        main {
            min-height: calc(100vh - 137px);
            padding: 45px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: white;
            border: 1px solid #e1e9f3;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(25, 55, 90, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #68788e;
            font-size: 16px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cfd9e6;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #c5dcff;
            border-color: #1769e0;
        }

        button {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 6px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #1056bd; }

        .message {
            margin: 0 0 15px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .error { color: #c62828; }
        .success { color: #167548; }

        .signup-link {
            margin: 24px 0 0;
            text-align: center;
            color: #65758a;
            font-size: 15px;
        }

        .signup-link a {
            color: #1769e0;
            font-weight: 600;
            text-decoration: none;
        }

        footer {
            min-height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #142943;
            color: white;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            header { padding: 0 20px; }
            .login-card { padding: 26px 22px; }
            h1 { font-size: 27px; }
        }
    </style>
</head>

<body>
    <header>
        <a class="brand" href="../index.html">MedSync</a>
        <a class="home-link" href="../index.html">Back to Home</a>
    </header>

    <main>
        <section class="login-card">
            <h1>Patient Login</h1>
            <p class="subtitle">Sign in to access your healthcare dashboard.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>

                <p id="message" class="message" aria-live="polite"></p>

                <button type="submit" id="loginButton">Login</button>
            </form>

            <p class="signup-link">
                Don't have an account?
                <a href="patient-signup.html">Sign Up</a>
            </p>
        </section>
    </main>

    <footer>MedSync Healthcare Management System</footer>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST", credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || data.message || "Login failed.");
                if (data.role !== "PATIENT") {
                    await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" });
                    throw new Error("This is not a patient account. Please use the correct role login.");
                }
                window.location.href = "patient-dashboard.html";
            } catch (error) {
                message.textContent = error.message === "Failed to fetch"
                    ? "Cannot connect to MedSync. Make sure the backend is running."
                    : error.message;
                message.className = "message error";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
