<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSync | Pharmacist Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F4F7FB;
            color: #142D4E;
        }

        .sidebar {
            width: 245px;
            height: 100vh;
            background: #142D4E;
            position: fixed;
            top: 0;
            left: 0;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: white;
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links a,
        .logout {
            padding: 13px 15px;
            color: #DCE6F2;
            text-decoration: none;
            border-radius: 6px;
            background: transparent;
            border: none;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a.active,
        .logout:hover {
            background: #285D99;
            color: white;
        }

        .logout {
            margin-top: auto;
        }

        main {
            margin-left: 245px;
            padding: 30px;
        }

        header,
        .panel {
            background: white;
            border: 1px solid #E0E6EF;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .muted {
            color: #64748B;
            font-size: 14px;
            line-height: 1.6;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .profile-item {
            background: #F8FAFD;
            border: 1px solid #E0E6EF;
            border-radius: 8px;
            padding: 20px;
        }

        .profile-item strong {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .profile-item span {
            font-size: 14px;
            color: #64748B;
            overflow-wrap: anywhere;
        }

        .error {
            color: #B42318;
            margin-top: 20px;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .logout {
                margin-top: 20px;
            }

            main {
                margin-left: 0;
                padding: 18px;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <a href="/index.html" class="logo">MedSync</a>

        <nav class="nav-links">
            <a href="pharmacist-dashboard.html">Dashboard</a>
            <a href="pharmacist-inventory.html">Medicine Inventory</a>
            <a href="pharmacist-orders.html">Prescription Orders</a>
            <a href="pharmacist-add-medicine.html">Add Medicine</a>
            <a href="pharmacist-profile.html" class="active">My Profile</a>
        </nav>

        <button class="logout" onclick="logout()">Logout</button>
    </aside>

    <main>

        <header>
            <h1>My Profile</h1>
            <p class="muted">Your registered pharmacist account information.</p>
        </header>

        <section class="panel">

            <h2>Pharmacist Information</h2>

            <div class="profile-grid" id="profileDetails">
                <p class="muted">Loading profile...</p>
            </div>

            <p id="message" class="error"></p>

        </section>

    </main>

    <script>
        const LOGIN_URL = "/login/pharmacist-login.html";

        async function api(url, options = {}) {
            const response = await fetch(url, {
                credentials: "same-origin",
                ...options
            });

            const text = await response.text();
            let data = {};

            if (text) {
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { message: text };
                }
            }

            if (!response.ok) {
                const error = new Error(
                    data.error || data.message ||
                    `Request failed (${response.status})`
                );
                error.status = response.status;
                throw error;
            }

            return data;
        }

        function safe(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[c]));
        }

        async function loadProfile() {
            try {
                const user = await api("/api/auth/me");

                if (user.role !== "PHARMACIST") {
                    location.replace("/index.html");
                    return;
                }

                const fields = {
                    "Full Name": user.fullName,
                    "Email Address": user.email,
                    "Phone Number": user.phone,
                    "Pharmacy Name": user.pharmacyName,
                    "Pharmacy Address": user.address,
                    "License Number": user.licenseNumber,
                    "Delivery Charge": `₹${Number(user.deliveryCharge ?? 0).toFixed(2)}`,
                    "Verification Status": user.verified
                        ? "Verified"
                        : "Pending Verification",
                    "Account Status": user.active
                        ? "Active"
                        : "Inactive"
                };

                document.getElementById("profileDetails").innerHTML =
                    Object.entries(fields).map(([label, value]) => `
                        <div class="profile-item">
                            <strong>${safe(label)}</strong>
                            <span>${safe(value ?? "Not provided")}</span>
                        </div>
                    `).join("");

            } catch (error) {
                if (error.status === 401) {
                    location.replace(LOGIN_URL);
                    return;
                }

                document.getElementById("message").textContent =
                    error.message;
            }
        }

        async function logout() {
            try {
                await api("/api/auth/logout", { method: "POST" });
            } finally {
                location.replace(LOGIN_URL);
            }
        }

        loadProfile();
    </script>

</body>
</html>
