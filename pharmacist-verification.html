
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacist Verification | MedSync</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #142d4e;
        }

        /* Header */
        header {
            height: 80px;
            background: #142d4e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .brand {
            font-size: 26px;
            font-weight: 700;
        }

        .logout-button {
            background: white;
            color: #142d4e;
            border: 1px solid #dce3ed;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #e9eef5;
        }

        /* Main content */
        main {
            width: 90%;
            max-width: 1006px;
            margin: 33px auto;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 18px;
            color: #142d4e;
        }

        .description {
            color: #667991;
            font-size: 16px;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .back-button {
            display: inline-block;
            background: #2463a6;
            color: white;
            text-decoration: none;
            padding: 11px 16px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .back-button:hover {
            background: #194d85;
        }

        /* Status message */
        .status-message {
            color: #2463a6;
            font-size: 16px;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .status-message.error {
            color: #b42318;
        }

        .status-message.success {
            color: #16834a;
        }

        /* Application cards and empty state */
        .application-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .application-card,
        .empty-state {
            background: white;
            border-radius: 8px;
            padding: 24px;
        }

        .empty-state {
            color: #667991;
            font-size: 16px;
            line-height: 1.6;
        }

        .application-card h2 {
            font-size: 21px;
            margin-bottom: 16px;
            overflow-wrap: anywhere;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .detail-label {
            display: block;
            color: #667991;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #243447;
            font-size: 15px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .pending-label {
            display: inline-block;
            color: #8a5a00;
            background: #fff4d6;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #edf0f4;
        }

        .action-button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .approve-button {
            background: #16834a;
        }

        .approve-button:hover {
            background: #116a3b;
        }

        .reject-button {
            background: #d83a3a;
        }

        .reject-button:hover {
            background: #b92b2b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            header {
                height: 70px;
                padding: 0 16px;
            }

            .brand {
                font-size: 23px;
            }

            main {
                width: 90%;
                margin: 26px auto;
            }

            h1 {
                font-size: 27px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .application-card,
            .empty-state {
                padding: 18px;
            }

            .card-actions {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">MedSync</div>

        <button type="button" class="logout-button" id="logoutButton">
            Logout
        </button>
    </header>

    <main>
        <h1>Pharmacist Verification</h1>

        <p class="description">
            Review pharmacist registration details and approve or reject applications.
        </p>

        <a href="admin-dashboard.html" class="back-button">
            Back to Dashboard
        </a>

        <div id="statusMessage" class="status-message" role="status" aria-live="polite">
            Loading pharmacist applications...
        </div>

        <div id="applicationList" class="application-list"></div>
    </main>

    <script>
        const applicationList = document.getElementById("applicationList");
        const statusMessage = document.getElementById("statusMessage");
        const logoutButton = document.getElementById("logoutButton");

        async function api(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                credentials: "same-origin",
                headers: {
                    ...(options.body
                        ? { "Content-Type": "application/json" }
                        : {}),
                    ...(options.headers || {})
                }
            });

            const text = await response.text();
            let data = null;

            if (text) {
                try {
                    data = JSON.parse(text);
                } catch {
                    data = text;
                }
            }

            if (!response.ok) {
                const message =
                    typeof data === "object" && data !== null
                        ? data.message || data.error
                        : data;

                throw new Error(message || `Request failed (${response.status})`);
            }

            return data;
        }

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function valueOrDefault(value) {
            return value === null || value === undefined || value === ""
                ? "Not provided"
                : escapeHTML(value);
        }

        function formatDate(value) {
            if (!value) {
                return "Not provided";
            }

            const date = new Date(value);

            return Number.isNaN(date.getTime())
                ? escapeHTML(value)
                : escapeHTML(date.toLocaleString());
        }

        function showStatus(message, type = "") {
            statusMessage.textContent = message;
            statusMessage.className = "status-message";

            if (type) {
                statusMessage.classList.add(type);
            }
        }

        function renderApplications(pharmacists) {
            applicationList.innerHTML = "";

            if (pharmacists.length === 0) {
                showStatus("There are no pending pharmacist applications.");

                applicationList.innerHTML = `
                    <div class="empty-state">
                        No pharmacist applications need verification right now.
                    </div>
                `;
                return;
            }

            showStatus(
                `There are ${pharmacists.length} pending pharmacist application(s).`
            );

            pharmacists.forEach(pharmacist => {
                const card = document.createElement("section");
                card.className = "application-card";

                card.innerHTML = `
                    <h2>${valueOrDefault(pharmacist.fullName)}</h2>

                    <span class="pending-label">Pending Verification</span>

                    <div class="details">
                        <div>
                            <span class="detail-label">Email</span>
                            <div class="detail-value">${valueOrDefault(pharmacist.email)}</div>
                        </div>

                        <div>
                            <span class="detail-label">Phone</span>
                            <div class="detail-value">${valueOrDefault(pharmacist.phone)}</div>
                        </div>

                        <div>
                            <span class="detail-label">Pharmacy Name</span>
                            <div class="detail-value">${valueOrDefault(pharmacist.pharmacyName)}</div>
                        </div>

                        <div>
                            <span class="detail-label">Pharmacy Registration Number</span>
                            <div class="detail-value">${valueOrDefault(pharmacist.licenseNumber)}</div>
                        </div>

                        <div>
                            <span class="detail-label">Pharmacy Address</span>
                            <div class="detail-value">${valueOrDefault(pharmacist.address)}</div>
                        </div>

                        <div>
                            <span class="detail-label">Registration Date</span>
                            <div class="detail-value">${formatDate(pharmacist.createdAt)}</div>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button
                            type="button"
                            class="action-button reject-button"
                            data-action="reject"
                            data-id="${escapeHTML(pharmacist.id)}">
                            Reject
                        </button>

                        <button
                            type="button"
                            class="action-button approve-button"
                            data-action="approve"
                            data-id="${escapeHTML(pharmacist.id)}">
                            Approve
                        </button>
                    </div>
                `;

                applicationList.appendChild(card);
            });
        }

        async function loadApplications() {
            applicationList.innerHTML = `
                <div class="empty-state">Loading applications...</div>
            `;

            try {
                const result = await api("/api/admin/users");

                const users = Array.isArray(result)
                    ? result
                    : Array.isArray(result?.users)
                        ? result.users
                        : [];

                const pharmacists = users.filter(user =>
                    user.role === "PHARMACIST" &&
                    user.verified !== true &&
                    user.active === true
                );

                renderApplications(pharmacists);
            } catch (error) {
                showStatus(error.message, "error");

                applicationList.innerHTML = `
                    <div class="empty-state">
                        Unable to load pharmacist applications.
                    </div>
                `;
            }
        }

        applicationList.addEventListener("click", async event => {
            const button = event.target.closest("button[data-action]");

            if (!button || button.disabled) {
                return;
            }

            const id = button.dataset.id;
            const approved = button.dataset.action === "approve";
            const action = approved ? "approve" : "reject";

            if (!confirm(`Are you sure you want to ${action} this pharmacist?`)) {
                return;
            }

            const card = button.closest(".application-card");
            const buttons = card.querySelectorAll("button");

            buttons.forEach(item => {
                item.disabled = true;
            });

            try {
                await api(
                    `/api/admin/pharmacists/${encodeURIComponent(id)}/verification`,
                    {
                        method: "PATCH",
                        body: JSON.stringify({ approved })
                    }
                );

                showStatus(
                    approved
                        ? "Pharmacist approved successfully."
                        : "Pharmacist verification rejected successfully.",
                    "success"
                );

                await loadApplications();
            } catch (error) {
                showStatus(error.message, "error");

                buttons.forEach(item => {
                    item.disabled = false;
                });
            }
        });

        logoutButton.addEventListener("click", async () => {
            logoutButton.disabled = true;

            try {
                await api("/api/auth/logout", {
                    method: "POST"
                });

                window.location.href = "admin-login.html";
            } catch (error) {
                showStatus(`Logout failed: ${error.message}`, "error");
                logoutButton.disabled = false;
            }
        });

        async function initialize() {
            try {
                const user = await api("/api/auth/me");

                if (!user || user.role !== "ADMIN") {
                    window.location.href = "../index.html";
                    return;
                }

                await loadApplications();
            } catch (error) {
                showStatus(error.message, "error");

                applicationList.innerHTML = `
                    <div class="empty-state">
                        Unable to load the verification page. Please check your login.
                    </div>
                `;
            }
        }

        initialize();
    </script>

</body>
</html>
