<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacist Login | MedSync</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f7ff;
            color: #17243a
        }

        header {
            min-height: 72px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid #e3eaf4
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #1769e0;
            text-decoration: none
        }

        .home-link {
            color: #34445a;
            text-decoration: none;
            font-size: 15px
        }

        main {
            min-height: calc(100vh - 137px);
            padding: 45px 20px;
            display: flex;
            justify-content: center;
            align-items: center
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: white;
            border: 1px solid #e1e9f3;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(25, 55, 90, .08)
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px
        }

        .subtitle {
            margin: 0 0 28px;
            color: #68788e;
            font-size: 16px;
            line-height: 1.6
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 600
        }

        input {
            width: 100%;
            height: 48px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cfd9e6;
            border-radius: 6px;
            font-size: 15px
        }

        input:focus {
            outline: 2px solid #c5dcff;
            border-color: #1769e0
        }

        button {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 6px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer
        }

        button:hover {
            background: #1056bd
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed
        }

        .message {
            margin: 0 0 15px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere
        }

        .error {
            color: #c62828
        }

        .success {
            color: #167548
        }

        .signup-link {
            margin: 24px 0 0;
            text-align: center;
            color: #65758a;
            font-size: 15px
        }

        .signup-link a {
            color: #1769e0;
            font-weight: 600;
            text-decoration: none
        }

        footer {
            min-height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #142943;
            color: white;
            text-align: center;
            font-size: 14px
        }

        @media(max-width:500px) {
            header {
                padding: 0 20px
            }

            .login-card {
                padding: 26px 22px
            }

            h1 {
                font-size: 27px
            }
        }
    </style>
</head>

<body>
    <header><a class="brand" href="../index.html">MedSync</a><a class="home-link" href="../index.html">Back to Home</a>
    </header>
    <main>
        <section class="login-card">
            <h1>Pharmacist Login</h1>
            <p class="subtitle">Sign in to access your pharmacist dashboard.</p>
            <form id="loginForm"><label for="email">Email Address</label><input type="email" id="email"
                    autocomplete="email" required placeholder="Enter your email">
                <label for="password">Password</label><input type="password" id="password"
                    autocomplete="current-password" required placeholder="Enter your password">
                <p id="message" class="message" aria-live="polite"></p><button id="loginButton"
                    type="submit">Login</button>
            </form>
            <p class="signup-link">New pharmacist? <a href="pharmacist-signup.html">Create account</a></p>
        </section>
    </main>
    <footer>MedSync Healthcare Management System</footer>
    <script>
        const form = document.getElementById('loginForm'), msg = document.getElementById('message'), btn = document.getElementById('loginButton');
        form.addEventListener('submit', async e => {
            e.preventDefault(); btn.disabled = true; btn.textContent = 'Signing in...'; msg.textContent = '';
            try {
                const r = await fetch('/api/auth/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }) }); const d = await r.json(); if (!r.ok) throw Error(d.error || d.message || 'Login failed.');
                if (d.role !== 'PHARMACIST') { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); throw Error('This account is not registered as pharmacist. Use the correct role login.'); }
                location.href = 'pharmacist-dashboard.html';
            } catch (err) { msg.textContent = err.message === 'Failed to fetch' ? 'Cannot connect to MedSync. Make sure the backend is running.' : err.message; msg.className = 'message error'; }
            finally { btn.disabled = false; btn.textContent = 'Login'; }
        });
    </script>
</body>

</html>
