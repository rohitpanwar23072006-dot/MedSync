<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacist Signup | MedSync</title>

    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f7ff;color:#17243a}
        header{min-height:72px;padding:0 7%;display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid #e3eaf4}
        .brand{font-size:28px;font-weight:bold;color:#1769e0;text-decoration:none}
        .home-link{color:#34445a;text-decoration:none;font-size:15px}
        main{min-height:calc(100vh - 137px);padding:45px 20px;display:flex;justify-content:center;align-items:center}
        .signup-card{width:100%;max-width:460px;padding:38px;background:white;border:1px solid #e1e9f3;border-radius:12px;box-shadow:0 10px 30px rgba(25,55,90,.08)}
        h1{margin:0 0 10px;font-size:32px}
        .subtitle{margin:0 0 28px;color:#68788e;font-size:16px;line-height:1.6}
        label{display:block;margin:0 0 8px;font-size:15px;font-weight:600}
        input{width:100%;height:48px;padding:12px;margin-bottom:20px;border:1px solid #cfd9e6;border-radius:6px;font-size:15px}
        button{width:100%;min-height:48px;border:none;border-radius:6px;background:#1769e0;color:white;font-size:16px;font-weight:600;cursor:pointer}
        button:hover{background:#1056bd}
        button:disabled{opacity:.7}
        .message{margin:0 0 15px;font-size:14px;line-height:1.5}
        .error{color:#c62828}
        .success{color:#167548}
        .signup-link{margin:24px 0 0;text-align:center;color:#65758a;font-size:15px}
        .signup-link a{color:#1769e0;font-weight:600;text-decoration:none}
        footer{min-height:65px;display:flex;justify-content:center;align-items:center;padding:16px;background:#142943;color:white;text-align:center;font-size:14px}
        @media(max-width:500px){header{padding:0 20px}.signup-card{padding:26px 22px}h1{font-size:27px}}
    </style>
</head>

<body>

    <header>
        <a class="brand" href="../index.html">MedSync</a>
        <a class="home-link" href="../index.html">Back to Home</a>
    </header>

    <main>
        <section class="signup-card">

            <h1>Pharmacist Signup</h1>

            <p class="subtitle">
                Create your account. Register your pharmacy to manage medicine inventory and orders.
            </p>

            <form id="signupForm">

                <label for="fullName">Full Name</label>
                <input id="fullName" required autocomplete="name"
                       placeholder="Enter your full name">

                <label for="email">Email Address</label>
                <input id="email" type="email" required autocomplete="email"
                       placeholder="Enter your email">

                <label for="phone">Phone Number</label>
                <input id="phone" type="tel"
                       placeholder="Enter your phone number">

                <label for="pharmacyName">Pharmacy Name</label>
                <input id="pharmacyName" type="text" required
                       placeholder="Enter your pharmacy name">

                <label for="licenseNumber">Pharmacy Registration ID</label>
                <input id="licenseNumber" required
                       placeholder="Enter pharmacy registration ID">

                <label for="address">Pharmacy Address</label>
                <input id="address" required
                       placeholder="Enter pharmacy address">

                <label for="deliveryCharge">Delivery Charge (₹)</label>
                <input id="deliveryCharge" type="number"
                       min="0" step="0.01" required
                       placeholder="Enter delivery charge">

                <label for="password">Password</label>
                <input id="password" type="password" minlength="8"
                       required autocomplete="new-password"
                       placeholder="At least 8 characters">

                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" type="password" minlength="8"
                       required placeholder="Confirm your password">

                <p id="message" class="message" aria-live="polite"></p>

                <button id="signupButton" type="submit">
                    Create Account
                </button>

            </form>

            <p class="signup-link">
                Already registered?
                <a href="pharmacist-login.html">Login</a>
            </p>

        </section>
    </main>

    <footer>MedSync Healthcare Management System</footer>

    <script>
        const form = document.getElementById('signupForm');
        const msg = document.getElementById('message');
        const btn = document.getElementById('signupButton');

        form.addEventListener('submit', async e => {

            e.preventDefault();

            msg.textContent = '';

            if (
                document.getElementById('password').value !==
                document.getElementById('confirmPassword').value
            ) {
                msg.textContent = 'Passwords do not match.';
                msg.className = 'message error';
                return;
            }

            const body = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value,
                role: 'PHARMACIST'
            };

            body.licenseNumber =
                document.getElementById('licenseNumber').value.trim();

            body.address =
                document.getElementById('address').value.trim();

            // New pharmacy details
            body.pharmacyName =
                document.getElementById('pharmacyName').value.trim();

            body.deliveryCharge =
                Number(document.getElementById('deliveryCharge').value);

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {

                const r = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                const d = await r.json();

                if (!r.ok) {
                    throw Error(d.error || d.message || 'Signup failed.');
                }

                msg.textContent =
                    'Account created successfully. You can now log in.';

                msg.className = 'message success';

                form.reset();

                setTimeout(() => {
                    location.href = 'pharmacist-login.html';
                }, 1600);

            } catch (err) {

                msg.textContent =
                    err.message === 'Failed to fetch'
                        ? 'Cannot connect to MedSync.'
                        : err.message;

                msg.className = 'message error';

            } finally {

                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>

</body>
</html>
