<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSync | Prescription Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F4F7FB;
            color: #142D4E;
        }

        .sidebar {
            width: 245px;
            height: 100vh;
            background: #142D4E;
            position: fixed;
            top: 0;
            left: 0;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: white;
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links a,
        .logout {
            padding: 13px 15px;
            color: #DCE6F2;
            text-decoration: none;
            border-radius: 6px;
            background: transparent;
            border: none;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a.active,
        .logout:hover {
            background: #285D99;
            color: white;
        }

        .logout {
            margin-top: auto;
        }

        main {
            margin-left: 245px;
            padding: 30px;
        }

        header,
        .panel {
            background: white;
            border: 1px solid #E0E6EF;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .muted {
            color: #64748B;
            font-size: 14px;
            line-height: 1.6;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn {
            background: #1D5FA7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover {
            background: #285D99;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #E0E6EF;
            border-radius: 8px;
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #F1F5FA;
            padding: 15px;
            font-size: 13px;
        }

        td {
            padding: 15px;
            font-size: 14px;
            border-top: 1px solid #E0E6EF;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            background: #E8F1FF;
            color: #1D5FA7;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .order-actions button {
            padding: 8px 10px;
            font-size: 12px;
        }

        .message {
            margin-top: 18px;
            font-size: 14px;
        }

        .error {
            color: #B42318;
        }

        .success {
            color: #168044;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .logout {
                margin-top: 20px;
            }

            main {
                margin-left: 0;
                padding: 18px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <a href="/index.html" class="logo">MedSync</a>

        <nav class="nav-links">
            <a href="pharmacist-dashboard.html">Dashboard</a>
            <a href="pharmacist-inventory.html">Medicine Inventory</a>
            <a href="pharmacist-orders.html" class="active">Prescription Orders</a>
            <a href="pharmacist-add-medicine.html">Add Medicine</a>
            <a href="pharmacist-profile.html">My Profile</a>
        </nav>

        <button class="logout" onclick="logout()">Logout</button>
    </aside>

    <main>

        <header>
            <h1>Prescription Orders</h1>
            <p class="muted">Manage patient orders and delivery status.</p>
        </header>

        <section class="panel">

            <div class="page-header">
                <div>
                    <h2>Patient Orders</h2>
                    <p class="muted">Update the status of received orders.</p>
                </div>

                <button class="btn" onclick="loadOrders()">
                    Refresh Orders
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Patient</th>
                            <th>Medicine</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="ordersTable">
                        <tr>
                            <td colspan="7">Loading orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p id="message" class="message"></p>

        </section>

    </main>

    <script>
        const LOGIN_URL = "/login/pharmacist-login.html";

        async function api(url, options = {}) {
            const response = await fetch(url, {
                credentials: "same-origin",
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

            const text = await response.text();
            let data = {};

            if (text) {
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { message: text };
                }
            }

            if (!response.ok) {
                const error = new Error(
                    data.error || data.message ||
                    `Request failed (${response.status})`
                );
                error.status = response.status;
                throw error;
            }

            return data;
        }

        function safe(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[c]));
        }

        async function loadOrders() {
            const message = document.getElementById("message");
            message.textContent = "Loading orders...";
            message.className = "message";

            try {
                const orders = await api("/api/pharmacy/orders");

                const table = document.getElementById("ordersTable");

                if (!orders.length) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align:center;padding:25px;">
                                No prescription orders received.
                            </td>
                        </tr>
                    `;
                    message.textContent = "";
                    return;
                }

                table.innerHTML = orders.map(order => {
                    const status = String(order.status || "PLACED")
                        .toUpperCase();

                    const patientName =
                        order.patientName ||
                        order.patient?.fullName ||
                        "Unknown Patient";

                    const medicineName =
                        order.medicineName ||
                        order.medicine?.name ||
                        "Unknown Medicine";

                    const statuses = [
                        "PROCESSING",
                        "SHIPPED",
                        "COMPLETED"
                    ];

                    const buttons = statuses.map(nextStatus => `
                        <button
                            class="btn"
                            data-id="${safe(order.id)}"
                            data-status="${nextStatus}"
                            ${status === nextStatus ||
                              status === "COMPLETED" ||
                              status === "CANCELLED"
                                ? "disabled"
                                : ""}
                        >
                            ${nextStatus}
                        </button>
                    `).join("");

                    return `
                        <tr>
                            <td>#${safe(order.id)}</td>
                            <td>${safe(patientName)}</td>
                            <td>${safe(medicineName)}</td>
                            <td>${safe(order.quantity)}</td>
                            <td>₹${Number(order.totalPrice ?? 0).toFixed(2)}</td>
                            <td>
                                <span class="badge">
                                    ${safe(status)}
                                </span>
                            </td>
                            <td>
                                <div class="order-actions">
                                    ${buttons}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join("");

                message.textContent = "";

            } catch (error) {
                if (error.status === 401) {
                    location.replace(LOGIN_URL);
                    return;
                }

                message.textContent = error.message;
                message.className = "message error";
            }
        }

        document.getElementById("ordersTable")
            .addEventListener("click", async event => {

                const button = event.target.closest("button[data-id]");

                if (!button) return;

                const orderId = button.dataset.id;
                const status = button.dataset.status;
                const message = document.getElementById("message");

                button.disabled = true;

                try {
                    await api(`/api/pharmacy/orders/${orderId}`, {
                        method: "PATCH",
                        body: JSON.stringify({ status })
                    });

                    await loadOrders();

                    message.textContent =
                        `Order #${orderId} updated to ${status}.`;

                    message.className = "message success";

                } catch (error) {
                    if (error.status === 401) {
                        location.replace(LOGIN_URL);
                        return;
                    }

                    message.textContent = error.message;
                    message.className = "message error";
                    button.disabled = false;
                }
            });

        async function logout() {
            try {
                await api("/api/auth/logout", { method: "POST" });
            } finally {
                location.replace(LOGIN_URL);
            }
        }

        async function initialize() {
            try {
                const user = await api("/api/auth/me");

                if (user.role !== "PHARMACIST") {
                    location.replace("/index.html");
                    return;
                }

                await loadOrders();

            } catch (error) {
                if (error.status === 401) {
                    location.replace(LOGIN_URL);
                    return;
                }

                const message = document.getElementById("message");
                message.textContent = error.message;
                message.className = "message error";
            }
        }

        initialize();
    </script>

</body>
</html>
