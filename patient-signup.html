<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Signup | MedSync</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f7ff;
            color: #17243a;
        }

        header {
            min-height: 72px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid #e3eaf4;
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #1769e0;
            text-decoration: none;
        }

        .home-link {
            color: #34445a;
            text-decoration: none;
            font-size: 15px;
        }

        main {
            min-height: calc(100vh - 137px);
            padding: 45px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-card {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: white;
            border: 1px solid #e1e9f3;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(25, 55, 90, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #68788e;
            font-size: 16px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cfd9e6;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #c5dcff;
            border-color: #1769e0;
        }

        button {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 6px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #1056bd; }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin: 0 0 15px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .error { color: #c62828; }
        .success { color: #167548; }

        .signup-link {
            margin: 24px 0 0;
            text-align: center;
            color: #65758a;
            font-size: 15px;
        }

        .signup-link a {
            color: #1769e0;
            font-weight: 600;
            text-decoration: none;
        }

        footer {
            min-height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #142943;
            color: white;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            header { padding: 0 20px; }
            .signup-card { padding: 26px 22px; }
            h1 { font-size: 27px; }
        }
    </style>
</head>

<body>
    <header>
        <a class="brand" href="../index.html">MedSync</a>
        <a class="home-link" href="../index.html">Back to Home</a>
    </header>

    <main>
        <section class="signup-card">
            <h1>Patient Signup</h1>
            <p class="subtitle">Create your account to manage your healthcare.</p>

            <form id="signupForm">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName"
                       placeholder="Enter your full name"
                       autocomplete="name" required>

                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email"
                       autocomplete="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number"
                       autocomplete="tel">

                <label for="address">Delivery Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address">

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password"
                       minlength="8" autocomplete="new-password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="8" autocomplete="new-password" required>

                <p id="message" class="message" aria-live="polite"></p>

                <button type="submit" id="signupButton">Create Account</button>
            </form>

            <p class="signup-link">
                Already have an account?
                <a href="patient-login.html">Login</a>
            </p>
        </section>
    </main>

    <footer>MedSync Healthcare Management System</footer>

    <script>
        const signupForm = document.getElementById("signupForm");
        const message = document.getElementById("message");
        const signupButton = document.getElementById("signupButton");

        signupForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const dateOfBirth = document.getElementById("dateOfBirth").value;
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            message.textContent = "";
            message.className = "message";

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                message.className = "message error";
                return;
            }

            const signupData = {
                fullName: fullName,
                dateOfBirth: dateOfBirth,
                email: email,
                phone: phone,
                address: document.getElementById("address").value.trim(),
                password: password,
                role: "PATIENT"
            };

            signupButton.disabled = true;
            signupButton.textContent = "Creating Account...";

            try {
                const response = await fetch("/api/auth/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify(signupData)
                });

                const responseText = await response.text();
                let data = {};

                if (responseText) {
                    try {
                        data = JSON.parse(responseText);
                    } catch {
                        data = { message: responseText };
                    }
                }

                if (!response.ok) {
                    let errorMessage = data.message || data.error;

                    if (!errorMessage && typeof data === "string") {
                        errorMessage = data;
                    }

                    if (!errorMessage) {
                        errorMessage = "Signup failed. Please try again.";
                    }

                    message.textContent =
                        "Error " + response.status + ": " + errorMessage;
                    message.className = "message error";
                    return;
                }

                message.textContent =
                    "Account created successfully! Redirecting to login...";
                message.className = "message success";

                signupForm.reset();

                setTimeout(function () {
                    window.location.href = "patient-login.html";
                }, 1200);

            } catch (error) {
                message.textContent =
                    "Unable to connect to the backend. Please try again.";
                message.className = "message error";
            } finally {
                signupButton.disabled = false;
                signupButton.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
